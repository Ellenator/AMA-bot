<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ellenators AMA-botti</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="profil">
            <h2>Vær hilset!</h2>
            <p>- og velkommen til min AMA-botti</p>
        </section>

        <section class="chat">
            <form>
                <input
                type="text"
                id="questioninput"
                placeholder="Spørg mig om noget"
                autocomplete="off"
                />
                <button type="submit">
                    Send
                </button>
            </form>
        </section>
    </main>
</body>
</html>
